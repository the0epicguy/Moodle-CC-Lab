apiVersion: apps/v1
kind: Deployment
metadata:
  name: cc-demo
  labels:
    app: cc-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cc-demo
  template:
    metadata:
      labels:
        app: cc-demo
    spec:
      containers:
        - name: web
          image: cc-k8s-demo:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
